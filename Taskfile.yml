version: "3"

# The site: Astro Starlight under src/, and two Go tools under tools/ - refgen writes the
# reference pages from the sources they describe, linkcheck fails on a link the build did not
# produce. SPIN, TERRAFORM and BRAND are checkouts of spin-stack/spin, spin-stack/spin-terraform-aws
# and spin-stack/brand: by default the ones task sources fetches into .sources/, at the commits
# versions.yaml pins. SHOTS is where it unpacks the dashboard's screenshots, which spin's
# release carries as site-shots.tar.gz. Node and pnpm run in the image the Dockerfile makes: a host
# needs Go and Docker, and every machine builds with the same Node.

vars:
  SPIN: '{{.SPIN | default ".sources/spin"}}'
  TERRAFORM: '{{.TERRAFORM | default ".sources/spin-terraform-aws"}}'
  BRAND: '{{.BRAND | default ".sources/brand"}}'
  SHOTS: '{{.SHOTS | default ".sources/spin-site-shots"}}'
  BASE_PATH: '{{.BASE_PATH | default "/"}}'
  PORT: '{{.PORT | default "4321"}}'
  HOST: '{{.HOST | default "127.0.0.1"}}'
  IMAGE: spinbox-docs
  # The Cloudflare Pages project, and the domain its main is served at.
  PROJECT: spinbox-docs
  DOMAIN: docs.spinbox.dev
  UID:
    sh: id -u
  GID:
    sh: id -g

tasks:
  # The images are versions.yaml's (versions args). GITHUB_TOKEN, when set, is what sfw downloads
  # the firewall with: anonymous downloads are the first GitHub sheds under load. A secret, so it
  # is in no layer of the image.
  install:
    desc: Build the image with the site's dependencies from the lockfile, installed through Socket Firewall (sfw) - the Dockerfile's deps stage. The tasks that need it build it.
    cmds:
      - docker build --target deps $(versions args golang node) --secret id=github_token,env=GITHUB_TOKEN -t {{.IMAGE}}:deps .

  dev:
    desc: Serve the site with live reload at http://localhost:4321 (HOST=0.0.0.0 for every interface, PORT=N for another port). The source is mounted; node_modules comes from the image.
    deps: [install]
    cmds:
      # The mount point for the image's node_modules; made here so it is yours, not root's.
      - mkdir -p node_modules
      - >-
        docker run --rm -it --init
        --user {{.UID}}:{{.GID}} -e HOME=/tmp
        -v "$PWD":/app -v /app/node_modules
        -p {{.HOST}}:{{.PORT}}:4321
        {{.IMAGE}}:deps
        pnpm dev --port 4321 --host 0.0.0.0

  sources:
    desc: Fetch spin, spin-terraform-aws and brand into .sources/, each at the commit versions.yaml pins, and spin's release's screenshots (site-shots.tar.gz) beside them. spin is private - SOURCES_TOKEN, or git's own credentials, reads it.
    cmds:
      - go run ./tools/sources spin spin-terraform-aws brand

  sources:bump:
    desc: Move the pins to the newest releases - spin only to one that holds the commit pinned, brand to its main - and fetch them, and rewrite the prices and the blog's posts. Then task reference.
    cmds:
      - go run ./tools/sources -bump spin spin-terraform-aws brand
      - task: pricing
      - task: posts

  # The cost page's numbers: generated, dated, and refused by reference:check once they are a
  # month old or of other machines than the module starts, so a figure on the page is never
  # quietly stale. The sync rewrites them every day.
  pricing:
    desc: Write src/data/pricing.json - what the machines the module starts by default cost an hour, on demand, in each region with images, from the lists the AWS pricing page loads (tools/pricing).
    cmds:
      - go run ./tools/pricing -terraform {{.TERRAFORM}} -out src/data/pricing.json

  # The posts a page may link, [why](<post:the-slug>): what the blog's feed lists, so a draft's
  # slug never reaches this public site. The build reads the file and never the feed, and a feed
  # that cannot be read keeps it. The sync rewrites it every day.
  posts:
    desc: Write src/data/posts.json - the posts the blog has published, from its feed (tools/posts).
    cmds:
      - go run ./tools/posts -out src/data/posts.json

  sync:pr:
    desc: Commit what sources:bump and reference changed to branch sync/sources as the sync App (SYNC_TOKEN, BOT its login), and open its one pull request or update it. sync.yml runs it.
    cmds:
      - go run ./tools/sync pr -bot '{{.BOT}}' -reference '{{.REFERENCE | default "success"}}'

  sync:issue:
    desc: Write spin's issue "Site vs spin main" as the sources App (SOURCES_TOKEN, BOT its login) - MODE release, the commits a bump takes in, or main, what spin main has past the pin - with the release chain. sync.yml runs it.
    cmds:
      - go run ./tools/sync issue -mode '{{.MODE}}' -bot '{{.BOT}}'

  reference:
    desc: Write the reference pages (CLI, Terraform, config file, API) and what the site copies from the spin, spin-terraform-aws and brand checkouts.
    cmds:
      - task: sources
      - go run ./tools/refgen -spin {{.SPIN}} -terraform {{.TERRAFORM}} -brand {{.BRAND}} -shots {{.SHOTS}}

  reference:check:
    desc: Fail if a reference page is not what the sources say.
    cmds:
      - task: sources
      - go run ./tools/refgen -spin {{.SPIN}} -terraform {{.TERRAFORM}} -brand {{.BRAND}} -shots {{.SHOTS}} -check
      - go run ./tools/pricing -terraform {{.TERRAFORM}} -check

  # A hand-written page names what it reads and the release it was read against (tools/refgen's
  # reads.go), and reference:check fails once that has changed. This is the answer: after reading
  # the page against the diff the check named, and correcting it.
  reviewed:
    desc: Stamp a hand-written page's reads with the sources as they are - PAGE=src/content/docs/<page> - once it has been read against what changed.
    requires:
      vars: [PAGE]
    cmds:
      - go run ./tools/refgen -spin {{.SPIN}} -terraform {{.TERRAFORM}} -reviewed {{.PAGE}}

  reference:public:
    desc: Fail if what the site has of spin-terraform-aws and brand is not what they say at the commits versions.yaml pins. Needs no spin checkout, nor any credential.
    # A fork's pull request has no token to read spin with, and this half needs nothing of it:
    # what the site says of spin stays as reference.json has it, and is held by reference:check.
    cmds:
      - go run ./tools/sources spin-terraform-aws brand
      - go run ./tools/refgen -only terraform,brand -terraform .sources/spin-terraform-aws -brand .sources/brand -check
      - go run ./tools/pricing -terraform .sources/spin-terraform-aws -check

  build:
    desc: Build the site into dist/, with llms.txt, llms-full.txt and a .md twin of every page - the Dockerfile's build stage, after the build's own tests. SITE_URL and BASE_PATH are where it is served.
    cmds:
      - rm -rf dist
      - >-
        docker build --target dist $(versions args golang node) --secret id=github_token,env=GITHUB_TOKEN
        --build-arg SITE_URL={{.SITE_URL}} --build-arg BASE_PATH={{.BASE_PATH}}
        --output type=local,dest=dist .

  lint:
    desc: Biome over the code (lint, formatting, sorted imports; biome.json) and astro check over the types, as a stage of the image. Biome's own fixes are `pnpm exec biome check --write` in it.
    cmds:
      - docker build --target lint $(versions args golang node) --secret id=github_token,env=GITHUB_TOKEN --output type=cacheonly .

  links:
    desc: Fail on a link to a page or an anchor the build did not produce.
    cmds:
      - go run ./tools/linkcheck -base {{.BASE_PATH}} dist

  links:external:
    desc: Open every link out of the site and every ghcr.io reference, as a reader with no credential would. Run it on the day the repositories go public.
    cmds:
      - go run ./tools/linkcheck -external dist

  gate:
    desc: What CI runs - every install through the firewall and every workflow step a task, the install, vet and the tools' tests, Biome and astro check, the reference against the public sources, the build, and every link.
    cmds:
      - sfw check
      # The Task running this one, which taskgate asks for the task names a workflow step runs.
      - taskgate -task {{.TASK_EXE}}
      # AGENTS.md is loaded into every session of an agent's: a path or a task it names that the
      # tree does not have is an instruction to do what cannot be done.
      - refs -task {{.TASK_EXE}}
      - task: install
      - go vet ./...
      - go test ./...
      - task: lint
      - task: reference:public
      - task: build
      - task: links

  # Cloudflare Pages: main is production at https://docs.spinbox.dev, and any other branch a preview at
  # its own address, <branch>.spinbox-docs.pages.dev, public as the repository is. wrangler is a
  # dependency of the lockfile's, installed through the firewall as the rest are.
  deploy:
    desc: Build the site and upload it to Cloudflare Pages as BRANCH (else the checkout's) - main is production at https://docs.spinbox.dev, any other a preview at its own pages.dev address. Needs CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
    cmds:
      - task: build
      - task: upload

  upload:
    desc: Upload dist/ as it is to Cloudflare Pages as BRANCH (else the checkout's), and say its address - in the job's summary in CI, and as a comment on pull request PR when given. CI runs it after task check built dist/. Needs CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
    vars:
      BRANCH:
        sh: echo "${BRANCH:-$(git rev-parse --abbrev-ref HEAD)}"
      # A preview's address is the branch's alias: lowercase, anything else a hyphen, 28 characters.
      URL:
        sh: |
          if [ "{{.BRANCH}}" = main ]; then echo "https://{{.DOMAIN}}/"; else
            alias=$(printf %s "{{.BRANCH}}" | tr 'A-Z' 'a-z' | sed 's/[^a-z0-9]/-/g' | cut -c1-28 | sed 's/-*$//')
            echo "https://$alias.{{.PROJECT}}.pages.dev/"
          fi
    preconditions:
      - sh: test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
        msg: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are needed to upload
      - sh: test -f dist/index.html
        msg: nothing in dist/ to upload - task build first
    cmds:
      - task: install
      - >-
        docker run --rm -e CLOUDFLARE_API_TOKEN -e CLOUDFLARE_ACCOUNT_ID
        -v "$PWD/dist":/dist:ro {{.IMAGE}}:deps
        pnpm exec wrangler pages deploy /dist --project-name {{.PROJECT}} --branch {{.BRANCH}}
        --commit-hash "$(git rev-parse HEAD)" --commit-dirty=true
      - '[ -z "$GITHUB_STEP_SUMMARY" ] || echo "{{.BRANCH}} is at {{.URL}}" >> "$GITHUB_STEP_SUMMARY"'
      # One comment, edited at each push: the address stays, and the commit it shows moves.
      - '[ -z "$PR" ] || gh pr comment "$PR" --edit-last --create-if-none --body "Preview of $(git rev-parse --short HEAD): {{.URL}}"'

  cf:setup:
    desc: Once - create the Cloudflare Pages project (production branch main) and attach docs.spinbox.dev to it. The DNS record (a CNAME to spinbox-docs.pages.dev) is Route 53's, in spinbox.dev-deploy, as the blog's is. Needs CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
    preconditions:
      - sh: test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
        msg: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are needed
    cmds:
      - task: install
      - >-
        curl -fsS -o /dev/null -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"
        "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/{{.PROJECT}}"
        || docker run --rm -e CLOUDFLARE_API_TOKEN -e CLOUDFLARE_ACCOUNT_ID {{.IMAGE}}:deps
        pnpm exec wrangler pages project create {{.PROJECT}} --production-branch main
      - >-
        curl -fsS -X POST
        -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json"
        "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/{{.PROJECT}}/domains"
        -d '{"name":"{{.DOMAIN}}"}' || echo "{{.DOMAIN}} may already be attached; see the project's Custom domains"

  exposure:
    desc: What this repository shows the world - every ref's commits, pull request heads included, and its issues, pull requests and comments - against .github/exposure-allow.txt.
    # The repository is public: a value that lands in a pull request is published the moment the
    # pull request is opened. The private repositories are named, so this finds what the daily
    # workflow does, whose token sees none of the organization's.
    cmds:
      - exposure -allow .github/exposure-allow.txt -gitleaks-config .gitleaks.toml -private ami,ci,shipset,skills,spin,spinbox.dev-deploy spin-stack/website

  check:
    desc: What CI runs with the token that reads spin - the reference against the sources at their pins, and the gate.
    cmds:
      - task: reference:check
      - task: gate

  check:public:
    desc: What CI runs with no token to read spin, a fork's pull request - the gate, whose reference:public needs none.
    cmds:
      - task: gate
