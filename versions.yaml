# What the site is generated from, each written once: `task sources` fetches every pin into
# .sources/, refgen fails when src/data/reference.json records another commit, and
# `task sources:bump` moves them to the newest releases, which .github/workflows/sync.yml does
# every day for a person to review. It is go-tools' versions format, held by
# tools/sources/repo_test.go as any repository's is.

- name: spin
  kind: git
  source: https://github.com/spin-stack/spin
  version: v20261121.03
  pin: 89c5eb5ea9f218d3c2a184c68205560cb7d3886d
  track: github-release
  bump: go tool task sources:bump
  note: >-
    The release the site documents (D2: the newest, exactly). The daily sync moves it to the next
    release, never back to an older one; spin main past it is in spin's "Site vs spin main"
    issue. Private: fetched with the sources App's token.

- name: spin-terraform-aws
  kind: git
  source: https://github.com/spin-stack/spin-terraform-aws
  version: v20261123.01
  pin: ef3410ba7e6ea3d29eaf1d4caab6cff89e690908
  track: github-release
  bump: go tool task sources:bump
  note: >-
    The module the AWS pages describe and pin. Fetched with its tags: a page names the newest
    release the commit holds. The images of the release spin is pinned at are read from its image
    catalog, on its catalog branch, not from this checkout.

- name: brand
  kind: git
  source: https://github.com/spin-stack/brand
  version: v20261122.01
  pin: 591ae52460634d893e04410b75dd432f1fad5da3
  track: github-release
  bump: go tool task sources:bump
  note: >-
    The palette, the faces and the logos, at the release the blog pins too, so both sites draw
    from one brand. After a bump: `task reference` copies what brand/consumers.toml lists for the
    website, the two @fontsource packages in package.json move to the versions brand's
    versions.yaml names, and the site is looked at in both themes. The dashboard's screenshots are
    not brand's: they are spin's release's, site-shots.tar.gz.

- name: task
  kind: download
  source: https://github.com/go-task/task/releases/download/v{version}/task_{os}_{arch}.tar.gz
  version: 3.54.0
  pins:
    linux/amd64: 680859dbb4d881a9c72d4d9a8f510825450849af8567deacd7302c01124416fb
    linux/arm64: d7189d439d4a6058e39e1b2acd7c8b27acd4856691b408f23b242e4294e1df5b
  track: github-release https://github.com/go-task/task
  note: >-
    The Task `go tool task` runs (go-tools' cmd/task), upstream's binary for the Linux platforms
    its runners and people work on: no repository compiles it.

- name: actionlint
  kind: module
  source: github.com/rhysd/actionlint/cmd/actionlint
  version: v1.7.12
  track: github-release https://github.com/rhysd/actionlint
  note: >-
    What `task lint:workflows` (go-tools' shared task) lints the workflows with, run by `go run`
    at this version.

- name: node
  kind: image
  source: mirror.gcr.io/library/node
  version: 22-bookworm-slim
  pin: sha256:be979e5523c76fa4d5ca4ebd3099078f220aa47ec39c48ad5b5df9314debd6eb
  track: digest
  note: >-
    The Node the Dockerfile installs, builds and serves the site with, on every machine and in CI.
    After a bump: `task check`, and a look at `task dev`.

- name: golang
  kind: image
  source: mirror.gcr.io/library/golang
  version: 1.27.4-bookworm
  pin: sha256:ce59b41415e2524ae99926fe1f37ce48ba8c194dcbd2a56a65436cdcefa2bd34
  track: go
  note: >-
    What the Dockerfile builds go-tools' sfw with, the firewall the install in the image goes
    through. After a bump: `task install`.
