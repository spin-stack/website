# What the site is generated from, each written once: `task sources` fetches every pin into
# .sources/, refgen fails when src/data/reference.json records another commit, and
# `task sources:bump` moves them to the newest releases, which .github/workflows/sync.yml does
# every day for a person to review. It is go-tools' versions format, held by
# tools/sources/repo_test.go as any repository's is.

- name: spin
  kind: git
  source: https://github.com/spin-stack/spin
  version: v20261110.01
  pin: b7ba5206f12ba93a829a48e354be7fce6bc65db4
  track: github-release
  note: >-
    The release the site documents (D2: the newest, exactly). The daily sync moves it to the next
    release, never back to an older one; spin main past it is in spin's "Site vs spin main"
    issue. Private: fetched with the sources App's token.

