name: Pages

# Builds the site on every push and pull request as a developer checks it, and publishes main to
# GitHub Pages: task check, the reference against spin, spin-terraform-aws and brand at the
# commits versions.yaml pins, and the gate - the build, every link, a page without the
# experimental notice. spin is private: the sources App's token reads it, in the one step that
# fetches, and the steps after it build and run spin's CLI with no token at all. A pull request
# from a fork has no secret, so it runs task check:public, which holds the site to the public
# sources and keeps what it says of spin as reference.json has it. Dependabot's pull requests
# have the App as a Dependabot secret, and run the whole check.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # The check main's ruleset requires, named Gate in every spin-stack repository: the build.
    name: Gate
    runs-on: ubuntu-latest
    env:
      # Whether this run has the sources App: a secret cannot be asked in an if, its presence can.
      SOURCES_APP: ${{ secrets.SOURCES_APP_KEY != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every commit, so each page's "Last updated" is its own last change, not the checkout's.
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # No store cache: a package restored from one is never asked of the registry, so Socket
      # Firewall, which stands between the two, would not see it.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # The modules and the build cache, spin's among them: spin is pinned in versions.yaml,
          # so a bump of it is a new key and every other run builds its CLI from the cache.
          cache-dependency-path: |
            go.sum
            versions.yaml
      # Read-only, on spin alone: the public sources need no token.
      - id: sources-token
        if: env.SOURCES_APP == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.SOURCES_APP_ID }}
          private-key: ${{ secrets.SOURCES_APP_KEY }}
          owner: spin-stack
          repositories: spin
          permission-contents: read
      - name: Sources
        if: env.SOURCES_APP == 'true'
        env:
          # tools/sources hands it to its own git commands as GIT_CONFIG_*, and writes it nowhere.
          SOURCES_TOKEN: ${{ steps.sources-token.outputs.token }}
        run: go tool task sources
      # What a developer runs, with the Task go.mod pins: task check, the install through Socket
      # Firewall among it. The sources are fetched, so this asks nothing of spin.
      - if: env.SOURCES_APP == 'true'
        run: go tool task check
      - if: env.SOURCES_APP != 'true'
        run: go tool task check:public
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    # Nine seconds of API calls, billed as a minute: the smallest runner, at a third of a 2-core's
    # price. Not folded into the build job: the github-pages environment deploys from main alone,
    # and the build runs on every pull request.
    runs-on: ubuntu-slim
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
