name: Pages

# Builds the site on every push and pull request as a developer checks it, and uploads it to
# Cloudflare Pages - main to https://docs.spinbox.dev, a pull request's branch to a preview at its own
# pages.dev address, which the pull request is told in a comment: task check, the reference against spin, spin-terraform-aws and brand at the
# commits versions.yaml pins, and the gate - the build, every link, a page without the
# experimental notice. spin is private: the sources App's token reads it, in the one step that
# fetches, and the steps after it build and run spin's CLI with no token at all. A pull request
# from a fork has no secret, so it runs task check:public, which holds the site to the public
# sources and keeps what it says of spin as reference.json has it, and is not uploaded.
# Dependabot's pull requests have the App as a Dependabot secret, and run the whole check.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

# go-tools' downloads (sfw, versions) ask GitHub with this: anonymous ones are the first it sheds
# under load, and they answered 504 for minutes on 2026-11-09.
env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  build:
    # The check main's ruleset requires, named Gate in every spin-stack repository: the build.
    name: Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The preview's address, as one comment on the pull request.
      pull-requests: write
    env:
      # Whether this run has the sources App, and Cloudflare's token: a secret cannot be asked in
      # an if, its presence can.
      SOURCES_APP: ${{ secrets.SOURCES_APP_KEY != '' }}
      CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
      # Google Tag Manager's container ID, a repository variable, for production's build alone: a
      # preview's has no analytics. Unset, no build has any.
      GTM_ID: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.GTM_ID || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every commit, so each page's "Last updated" is its own last change, not the checkout's.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # The modules and the build cache, spin's among them: spin is pinned in versions.yaml,
          # so a bump of it is a new key and every other run builds its CLI from the cache.
          cache-dependency-path: |
            go.sum
            versions.yaml
      # Read-only, on spin alone: the public sources need no token.
      - id: sources-token
        if: env.SOURCES_APP == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: Iv23li1IcazrCq1yAVQt # spin-stack-website-sources' client ID, public: app-id is deprecated
          private-key: ${{ secrets.SOURCES_APP_KEY }}
          owner: spin-stack
          repositories: spin
          permission-contents: read
      - name: Sources
        if: env.SOURCES_APP == 'true'
        env:
          # tools/sources hands it to its own git commands as GIT_CONFIG_*, and writes it nowhere.
          SOURCES_TOKEN: ${{ steps.sources-token.outputs.token }}
        run: go tool task sources
      # What a developer runs, with the Task go.mod pins: task check, the install through Socket
      # Firewall among it, in the image the Dockerfile makes - Node and pnpm are the image's, not
      # the runner's. The sources are fetched, so this asks nothing of spin.
      - if: env.SOURCES_APP == 'true'
        run: go tool task check
      - if: env.SOURCES_APP != 'true'
        run: go tool task check:public
      # dist/ as task check built it, uploaded as the branch: main is production.
      - name: Upload
        if: env.CLOUDFLARE == 'true'
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
          PR: ${{ github.event.pull_request.number }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: go tool task upload
