name: Pages

# Builds the site on every push and pull request with task gate, as a developer does: fails on a
# broken link or a page without the experimental notice, and publishes main to GitHub Pages. The
# reference pages are committed. The gate holds what they take from spin-terraform-aws and brand,
# both public, to those repositories at the commits src/data/reference.json records; what they
# take from spin is held by `task reference:check`, which this job runs once it can check spin out.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # The check main's ruleset requires, named Gate in every spin-stack repository: the build.
    name: Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every commit, so each page's "Last updated" is its own last change, not the checkout's.
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # No store cache: a package restored from one is never asked of the registry, so Socket
      # Firewall, which stands between the two, would not see it.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # What a developer runs, with the Task go.mod pins: task gate, the install through Socket
      # Firewall among it.
      - run: go tool task gate
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    # Nine seconds of API calls, billed as a minute: the smallest runner, at a third of a 2-core's
    # price. Not folded into the build job: the github-pages environment deploys from main alone,
    # and the build runs on every pull request.
    runs-on: ubuntu-slim
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
