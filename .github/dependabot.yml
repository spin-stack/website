# Every change to this file - a comment's too - starts a run of every ecosystem below, whatever
# the schedule says: change it rarely. Each runs Monday morning, a week after a release
# (cooldown), and rebase-strategy is disabled so a pull request is not remade each time main
# moves: main's ruleset merges a branch only up to date with it, and "Update branch" or
# `@dependabot rebase` brings one up when it is merged.
#
# The actions the workflow runs, each by its commit, the site's packages, which pnpm locks, and
# go-tools, whose commands and versions format the site's tools are built on.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    rebase-strategy: disabled
    # A release a week old has had a week for anybody to find it was not what it said.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    rebase-strategy: disabled
    cooldown:
      default-days: 7
    groups:
      # Majors on their own: one changelog to read, and one that fails the build does not take
      # the patches down with it.
      js:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: deps

  # go-tools only: the spin-stack Go tooling, moved the week a release of it is made - it is ours,
  # so no cooldown waits on it. Each release is tagged v0.<YYYYMMDD>.<N>, a module version, which is
  # what Dependabot reads. Taking the other modules is a change of its own, not this file's.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Argentina/Buenos_Aires
    rebase-strategy: disabled
    allow:
      - dependency-name: github.com/spin-stack/go-tools
    commit-message:
      prefix: go
