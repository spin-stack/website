# Every change to this file - a comment's too - starts a run of every ecosystem below, whatever
# the schedule says: change it rarely. Each runs Monday morning, a week after a release
# (cooldown), and rebase-strategy is disabled so a pull request is not remade each time main
# moves: main's ruleset merges a branch only up to date with it, and "Update branch" or
# `@dependabot rebase` brings one up when it is merged.
#
# The actions the workflow runs, each by its commit, and the site's packages, which pnpm locks.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    rebase-strategy: disabled
    # A release a week old has had a week for anybody to find it was not what it said.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    rebase-strategy: disabled
    cooldown:
      default-days: 7
    groups:
      # Majors on their own: one changelog to read, and one that fails the build does not take
      # the patches down with it.
      js:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: deps
