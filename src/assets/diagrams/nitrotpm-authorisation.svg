<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc">
  <title id="title">NitroTPM-attested authorization</title>
  <desc id="desc">OpenTofu declares trusted PCR measurements. An EC2 runner proves its AWS identity through STS and its boot measurements through NitroTPM. The control plane verifies both, while KMS releases keys only to matching measurements.</desc>
  <style>
    .bg { fill: #fff; }
    .grid { stroke: #edf1f7; stroke-width: 1; }
    .boundary { fill: #fffaf0; stroke: #f59e0b; stroke-width: 1.5; stroke-dasharray: 8 6; }
    .box { stroke-width: 2; rx: 10; }
    .external { fill: #f8fafc; stroke: #64748b; }
    .security { fill: #fff1f2; stroke: #e11d48; }
    .backend { fill: #ecfdf5; stroke: #059669; }
    .cloud { fill: #fffbeb; stroke: #d97706; }
    .label { fill: #0f172a; font: 600 17px ui-monospace, SFMono-Regular, Menlo, monospace; text-anchor: middle; }
    .sub { fill: #64748b; font: 14px ui-monospace, SFMono-Regular, Menlo, monospace; text-anchor: middle; }
    .small { fill: #b45309; font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .edge { fill: none; stroke-width: 2.5; marker-end: url(#arrow); }
    .dash { stroke: #e11d48; stroke-dasharray: 7 6; }
    .green { stroke: #059669; }
    .edge-label { fill: #fff; opacity: .95; }
    .edge-text { fill: #be123c; font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; text-anchor: middle; }
    .card { fill: #fff; stroke: #dbe3ee; stroke-width: 1; rx: 10; }
    .card-title { fill: #0f172a; font: 600 16px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .card-text { fill: #64748b; font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="context-stroke"/></marker>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse"><path class="grid" d="M0 0H40M0 0V40"/></pattern>
  </defs>
  <rect class="bg" width="1100" height="650"/>
  <rect fill="url(#dots)" width="1100" height="650"/>
  <text x="40" y="38" fill="#0f172a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="600">NitroTPM-attested authorization</text>

  <rect class="boundary" x="220" y="58" width="840" height="397" rx="18"/>
  <text class="small" x="240" y="83">The installation's AWS account and region</text>

  <rect class="box external" x="40" y="220" width="160" height="88"/>
  <text class="label" x="120" y="257">OpenTofu</text>
  <text class="sub" x="120" y="282">Trusted image</text><text class="sub" x="120" y="301">measurements</text>

  <rect class="box cloud" x="560" y="108" width="175" height="76"/>
  <text class="label" x="647" y="141">AWS STS</text>
  <text class="sub" x="647" y="165">Instance identity</text>

  <rect class="box backend" x="560" y="235" width="175" height="80"/>
  <text class="label" x="647" y="269">Control plane</text>
  <text class="sub" x="647" y="293">Verifies and admits</text>

  <rect class="box security" x="300" y="370" width="175" height="84"/>
  <text class="label" x="387" y="405">EC2 runner</text>
  <text class="sub" x="387" y="429">IAM role + NitroTPM</text>

  <rect class="box security" x="840" y="370" width="185" height="84"/>
  <text class="label" x="932" y="405">AWS KMS</text>
  <text class="sub" x="932" y="429">Keys only for</text><text class="sub" x="932" y="447">valid PCRs</text>

  <path class="edge dash" d="M200 264H255V275H560"/>
  <rect class="edge-label" x="355" y="258" width="110" height="20" rx="3"/><text class="edge-text" x="410" y="273">trusted PCRs</text>
  <path class="edge green" d="M387 370V340H647V315"/>
  <rect class="edge-label" x="490" y="325" width="160" height="20" rx="3"/><text class="edge-text" x="570" y="340">STS + TPM attestation</text>
  <path class="edge dash" d="M647 235V184"/>
  <rect class="edge-label" x="690" y="194" width="220" height="20" rx="3"/><text class="edge-text" x="800" y="209">checks role, audience and instance</text>
  <path class="edge dash" d="M475 412H840"/>
  <rect class="edge-label" x="580" y="397" width="185" height="20" rx="3"/><text class="edge-text" x="672" y="412">Decrypt with TPM document</text>

  <rect class="card" x="40" y="500" width="500" height="112"/>
  <circle cx="61" cy="523" r="5" fill="#059669"/><text class="card-title" x="76" y="529">What it proves</text>
  <text class="card-text" x="60" y="555">• The instance uses an allowed role</text>
  <text class="card-text" x="60" y="578">• It booted an image with an approved PCR combination</text>
  <text class="card-text" x="60" y="601">• The proof belongs to this request and boot key</text>

  <rect class="card" x="560" y="500" width="500" height="112"/>
  <circle cx="581" cy="523" r="5" fill="#e11d48"/><text class="card-title" x="596" y="529">What it blocks</text>
  <text class="card-text" x="580" y="555">• IAM credentials copied to another machine</text>
  <text class="card-text" x="580" y="578">• A changed image, disk or boot</text>
  <text class="card-text" x="580" y="601">• Replaying a captured proof</text>
</svg>
