<text text-anchor="start" x="805.0876" y="-833.3358" font-family="Arial" font-size="10.00" fill="#000000">Why this order.</text>
<text text-anchor="start" x="805.0876" y="-810.3358" font-family="Arial" font-size="10.00" fill="#000000">1 is first because 4 is what would otherwise carry it: the</text>
<text text-anchor="start" x="805.0876" y="-799.3358" font-family="Arial" font-size="10.00" fill="#000000">node&#39;s LAN is reached through the uplink like everything else,</text>
<text text-anchor="start" x="805.0876" y="-788.3358" font-family="Arial" font-size="10.00" fill="#000000">so a drop written after the accept never runs. It matches the</text>
<text text-anchor="start" x="805.0876" y="-777.3358" font-family="Arial" font-size="10.00" fill="#000000">destination alone and not the pair of interfaces &#45; what is kept</text>
<text text-anchor="start" x="805.0876" y="-766.3358" font-family="Arial" font-size="10.00" fill="#000000">away is a place, not a path, and a rule naming wan0 would stop</text>
<text text-anchor="start" x="805.0876" y="-755.3358" font-family="Arial" font-size="10.00" fill="#000000">applying the day there is a second way out.</text>
<text text-anchor="start" x="805.0876" y="-732.3358" font-family="Arial" font-size="10.00" fill="#000000">2 and 3 are between them, so a tag cannot open the node and a</text>
<text text-anchor="start" x="805.0876" y="-721.3358" font-family="Arial" font-size="10.00" fill="#000000">tag that closes a machine is reached by what its own rules did</text>
<text text-anchor="start" x="805.0876" y="-710.3358" font-family="Arial" font-size="10.00" fill="#000000">not claim.</text>
<text text-anchor="start" x="805.0876" y="-687.3358" font-family="Arial" font-size="10.00" fill="#000000">4 is open on purpose. There is no allowlist to write yet, so</text>
<text text-anchor="start" x="805.0876" y="-676.3358" font-family="Arial" font-size="10.00" fill="#000000">the accept records where it went instead &#45; see @observed, and</text>
<text text-anchor="start" x="805.0876" y="-665.3358" font-family="Arial" font-size="10.00" fill="#000000">`SIGUSR1` to the runner.</text>
</g>
</g>
</svg>
