<!-- note -->
<g id="node13" class="node">
<title>note</title>
<polygon fill="#fffbeb" stroke="#b45309" points="722.5,-1495.9308 407.5,-1495.9308 407.5,-1324.9308 728.5,-1324.9308 728.5,-1489.9308 722.5,-1495.9308"/>
<polyline fill="none" stroke="#b45309" points="722.5,-1495.9308 722.5,-1489.9308 "/>
<polyline fill="none" stroke="#b45309" points="728.5,-1489.9308 722.5,-1489.9308 "/>
<text text-anchor="start" x="420.5" y="-1480.9308" font-family="Arial" font-size="10.00" fill="#000000">Two translations, each doing one thing.</text>
<text text-anchor="start" x="420.5" y="-1457.9308" font-family="Arial" font-size="10.00" fill="#000000">The first turns the address every guest shares into one</text>
<text text-anchor="start" x="420.5" y="-1446.9308" font-family="Arial" font-size="10.00" fill="#000000">that is unique here &#45; 169.254.68.6 is identical on every</text>
<text text-anchor="start" x="420.5" y="-1435.9308" font-family="Arial" font-size="10.00" fill="#000000">machine on every host, which is what lets a checkpoint</text>
<text text-anchor="start" x="420.5" y="-1424.9308" font-family="Arial" font-size="10.00" fill="#000000">resume anywhere, and an address that repeats cannot cross</text>
<text text-anchor="start" x="420.5" y="-1413.9308" font-family="Arial" font-size="10.00" fill="#000000">anything shared.</text>
<text text-anchor="start" x="420.5" y="-1390.9308" font-family="Arial" font-size="10.00" fill="#000000">The second turns that into the node&#39;s, which is what a</text>
<text text-anchor="start" x="420.5" y="-1379.9308" font-family="Arial" font-size="10.00" fill="#000000">node&#39;s neighbours expect to see.</text>
<text text-anchor="start" x="420.5" y="-1356.9308" font-family="Arial" font-size="10.00" fill="#000000">The egress namespace in between translates nothing, so</text>
<text text-anchor="start" x="420.5" y="-1345.9308" font-family="Arial" font-size="10.00" fill="#000000">every packet crossing it still says which machine sent it.</text>
<text text-anchor="start" x="420.5" y="-1334.9308" font-family="Arial" font-size="10.00" fill="#000000">That is what a per&#45;machine rule is written against.</text>
</g>
</g>
</svg>
