<!-- note -->
<g id="node11" class="node">
<title>note</title>
<polygon fill="#fffbeb" stroke="#b45309" points="652.5,-739.7878 325.5,-739.7878 325.5,-582.7878 658.5,-582.7878 658.5,-733.7878 652.5,-739.7878"/>
<polyline fill="none" stroke="#b45309" points="652.5,-739.7878 652.5,-733.7878 "/>
<polyline fill="none" stroke="#b45309" points="658.5,-733.7878 652.5,-733.7878 "/>
<text text-anchor="start" x="337.5" y="-725.7878" font-family="Arial" font-size="10.00" fill="#000000">Both machines have the same address and the same MAC, and</text>
<text text-anchor="start" x="337.5" y="-714.7878" font-family="Arial" font-size="10.00" fill="#000000">neither can see the other&#39;s: the two /30s meet only in the</text>
<text text-anchor="start" x="337.5" y="-703.7878" font-family="Arial" font-size="10.00" fill="#000000">egress namespace.</text>
<text text-anchor="start" x="337.5" y="-680.7878" font-family="Arial" font-size="10.00" fill="#000000">Linux would happily route between them &#45; it holds a connected</text>
<text text-anchor="start" x="337.5" y="-669.7878" font-family="Arial" font-size="10.00" fill="#000000">route to each &#45; so the ruleset is what stops it, and the</text>
<text text-anchor="start" x="337.5" y="-658.7878" font-family="Arial" font-size="10.00" fill="#000000">ruleset is fail&#45;closed. The machine&#45;to&#45;machine drop is written</text>
<text text-anchor="start" x="337.5" y="-647.7878" font-family="Arial" font-size="10.00" fill="#000000">out even though the policy already covers it, because a rule</text>
<text text-anchor="start" x="337.5" y="-636.7878" font-family="Arial" font-size="10.00" fill="#000000">that somebody decided is different from a default, and it</text>
<text text-anchor="start" x="337.5" y="-625.7878" font-family="Arial" font-size="10.00" fill="#000000">counts the attempts.</text>
<text text-anchor="start" x="337.5" y="-602.7878" font-family="Arial" font-size="10.00" fill="#000000">The tenant is root on the far side of tap0. Everything that</text>
<text text-anchor="start" x="337.5" y="-591.7878" font-family="Arial" font-size="10.00" fill="#000000">enforces anything is on this side of it.</text>
</g>
</g>
