<!doctype html>
<!--
  The landing page's hero, as a throwaway prototype: three.js from a CDN, one file, nothing of the
  site's build. The brief it answers is BRIEF.md beside it. Serve this directory and open it;
  ?at=<seconds> freezes the film at that moment. Every label and caption says only what a page of
  the site already says, and names that page.
-->

* { box-sizing: border-box; }
html, body { margin: 0; background: var(--page); color: var(--text); font-family: 'IBM Plex Sans', system-ui, sans-serif; }
.stage { position: relative; height: 100vh; min-height: 560px; overflow: hidden; }
/* A canvas is a replaced element: inset alone leaves it at its drawing buffer's size, twice the
   stage on a retina screen. Its CSS size is the stage's. */
canvas.gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.labels { position: absolute; inset: 0; pointer-events: none; }
.flash { position: absolute; inset: 0; pointer-events: none; opacity: 0;
	background: radial-gradient(circle at 50% 50%, #EAF0F6 0%, #27BFE8 35%, #0E1421 80%); }

.copy { position: absolute; left: clamp(16px, 4vw, 56px); top: clamp(16px, 6vh, 64px); max-width: min(30rem, calc(100vw - 32px)); z-index: 2; }
.eyebrow { font: 500 12px/1 'IBM Plex Mono', monospace; letter-spacing: .08em; text-transform: uppercase; color: var(--label); display: flex; gap: .5rem; align-items: center; }
.eyebrow::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--cyan); }
h1 { font-size: clamp(1.6rem, 3.2vw, 2.6rem); line-height: 1.12; margin: .8rem 0 0; font-weight: 600; letter-spacing: -.01em; }
h1 .hl { color: var(--accent-text); }

.caption { position: absolute; left: clamp(16px, 4vw, 56px); bottom: clamp(84px, 13vh, 120px); max-width: min(30rem, calc(100vw - 32px)); z-index: 2;
	transition: opacity 200ms var(--ease); }
.caption .k { font: 500 12px/1 'IBM Plex Mono', monospace; color: var(--accent-text); letter-spacing: .06em; text-transform: uppercase; }
.caption p { margin: .5rem 0 0; font-size: 1.05rem; line-height: 1.5; color: var(--text); }
.caption a { font-size: .85rem; color: var(--accent-text); text-decoration: none; display: inline-block; margin-top: .5rem; }
.caption a[hidden] { display: none; }
.caption a:hover { text-decoration: underline; }

/* The player: one bar along the bottom. The whole film plays by itself; the steps are there to
   jump to one, and "step by step" stops at the end of each. */
.player { position: absolute; left: clamp(16px, 4vw, 56px); right: clamp(16px, 4vw, 56px); bottom: clamp(16px, 4vh, 36px); z-index: 3;
	display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.player button { font: 500 12px/1 'IBM Plex Mono', monospace; color: var(--text); background: var(--surface); border: 1px solid var(--border);
	border-radius: 6px; padding: 8px 10px; cursor: pointer; transition: border-color 120ms var(--ease); }
.player button:hover { border-color: var(--accent-text); }
.player button:focus-visible { outline: 2px solid var(--accent-text); outline-offset: 2px; }
.player button[aria-pressed="true"] { border-color: var(--cyan); color: var(--accent-text); }
.player .play { width: 36px; padding: 8px 0; text-align: center; }
.player .next[hidden] { display: none; }
.chapters { flex: 1; min-width: 260px; display: flex; gap: 4px; }
.chapters button { all: unset; cursor: pointer; flex: var(--w, 1); display: flex; flex-direction: column; gap: 6px; padding: 4px 0; }
.chapters button:focus-visible { outline: 2px solid var(--accent-text); outline-offset: 2px; border-radius: 3px; }
.chapters .bar { height: 3px; border-radius: 2px; background: var(--border); position: relative; overflow: hidden; }
.chapters .fill { position: absolute; inset: 0; width: 0; background: var(--cyan); }
.chapters .t { font: 500 11px/1 'IBM Plex Mono', monospace; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chapters button[aria-current="true"] .t { color: var(--text); }

.term { position: absolute; right: clamp(16px, 4vw, 56px); bottom: clamp(84px, 13vh, 120px); width: min(34rem, calc(100vw - 32px)); z-index: 2;
	background: color-mix(in srgb, var(--term-bg) 92%, transparent); border: 1px solid var(--border); border-radius: 8px;
	font: 12.5px/1.6 'IBM Plex Mono', monospace; color: #C9D1DE; padding: .7rem .9rem; opacity: 0; transform: translateY(8px);
	transition: opacity 200ms var(--ease), transform 200ms var(--ease); }
.term.on { opacity: 1; transform: none; }
.term .bar { font-size: 11px; color: #7D889C; margin-bottom: .35rem; }
.term .who { color: #27BFE8; }
.term .cur { display: inline-block; width: .55em; height: 1.05em; background: #27BFE8; vertical-align: -2px; }

.meter { position: absolute; z-index: 2; font: 500 12px/1 'IBM Plex Mono', monospace; color: var(--muted); }

.lbl { font: 500 11.5px/1.3 'IBM Plex Mono', monospace; color: var(--text); background: color-mix(in srgb, var(--page) 80%, transparent);
	border: 1px solid var(--border); border-radius: 4px; padding: 3px 6px; white-space: nowrap; opacity: 0; }
.lbl.accent { color: var(--accent-text); border-color: color-mix(in srgb, var(--cyan) 45%, var(--border)); }
.lbl.ok { color: var(--success); border-color: color-mix(in srgb, var(--success) 45%, var(--border)); }
.lbl.no { color: var(--error); border-color: color-mix(in srgb, var(--error) 45%, var(--border)); }
.lbl.big { font-size: 13px; }
.lbl.title { font-size: 12.5px; font-weight: 500; color: var(--text); border-color: var(--border_strong, #6B7894); }
.after { padding: 4rem clamp(16px, 4vw, 56px); color: var(--muted); max-width: 50rem; }

@media (max-width: 720px) {
	.chapters .t { display: none; }
	.term { bottom: 150px; font-size: 11px; }
	.caption { bottom: 70px; }
	.caption p { font-size: .95rem; }
}
</style>

<body>
<section class="stage" id="stage" aria-label="How a workspace is built">

	</div>
</section>

<script type="module">

A.add(browser);

const frame = edges(new THREE.PlaneGeometry(BW, BH), C.border, 0.9); A.add(frame);
const btnWorld = V((BTN.x + BTN.w / 2) / 1280 * BW - BW / 2, BH / 2 - (BTN.y + BTN.h / 2) / 800 * BH, 0.01);

const GY = -30;
const grid = new THREE.GridHelper(400, 200, C.border, C.raised); grid.position.y = GY; grid.material.transparent = true; grid.material.opacity = 0.55; A.add(grid);

const fpts = fibre.getSpacedPoints(FN);

const litGeo = new THREE.BufferGeometry().setFromPoints(fpts);

const rnd = mulberry(7);
for (let i = 0; i < 26; i++) {
	const ang = rnd() * Math.PI * 2, d = 60 + rnd() * 220;
	const s = V(Math.cos(ang) * d, GY + 0.05, -110 + Math.sin(ang) * d);

}
{
	const n = 1400, pos = new Float32Array(n * 3);
	for (let i = 0; i < n; i++) { const a = rnd() * 7, d = 20 + Math.pow(rnd(), 0.6) * 280; pos.set([Math.cos(a) * d, GY + 0.06, -110 + Math.sin(a) * d], i * 3); }

}
const signal = spark(1.1); A.add(signal);
const regionLbl = label('a region · <b>your AWS account</b>', 'accent big'); regionLbl.position.set(0, GY + 7, -112); A.add(regionLbl);

const HALL = { z0: -110, z1: -170, x: 16, h: 7 };
const hall = edges(new THREE.BoxGeometry(HALL.x * 2, HALL.h, HALL.z0 - HALL.z1), C.label, 0.5);
hall.position.set(0, GY + HALL.h / 2, (HALL.z0 + HALL.z1) / 2); A.add(hall);
const RACK = { w: 0.8, d: 1.1, h: 2.3 };

}

const slotFace = ROWS[TARGET.row] - RACK.d / 2 - 0.015;

const slotGlow = spark(0.01, C.cyan); slotGlow.position.set(slotFace - 0.02, SLOT_Y, TARGET.z); A.add(slotGlow);
const runnerLbl = label('a runner with room, or <b>one started</b> for it', 'accent'); runnerLbl.position.set(slotFace - 0.05, SLOT_Y + 0.42, TARGET.z); A.add(runnerLbl);
A.add(new THREE.AmbientLight(0xffffff, 0.6));
{ const dl = new THREE.DirectionalLight(0xbfd8ff, 1.4); dl.position.set(5, 10, 6); A.add(dl); }
A.add(new THREE.HemisphereLight(0x6cc6ee, 0x0e1421, 0.6));

const tmpP = new THREE.Vector3(), tmpL = new THREE.Vector3();
function shotA(t) {
	browser.redraw(t);
	const wide = camera.aspect > 1.1;
	const camStart = wide ? V(-1.45, -0.15, 5.9) : V(0, 0.6, 12.5), lookStart = wide ? V(-1.45, -0.15, 0) : V(0, 0.6, 0);

	// at login, the runner opens its connection to the proxy's relay
	drawLink(toRelay, smooth(seg(p4 * N, 7.6, 8.6)) + (p5 > 0 ? 1 : 0), 1 - seg(p6, 0, 0.4));
	show(relayLbl, seg(p4 * N, 7.8, 8.4) * (1 - seg(p5, 0.1, 0.2)));

	// 5. connect: a person opens a terminal in the browser; HTTPS to the proxy, the relay, the runner, the machine
	const ph = p5;
	if (Math.abs(ph - lapLast) > 0.004) { lapScreen.redraw(ph); lapLast = ph; }
	drawLink(fromLap, smooth(seg(ph, 0.28, 0.42)), 1 - seg(p6, 0, 0.4));
	const leg1 = seg(ph, 0.28, 0.42), leg2 = seg(ph, 0.42, 0.56), leg3 = seg(ph, 0.56, 0.62);
	if (leg1 > 0 && leg1 < 1) sessPkt.position.copy(along(fromLap.curvePts, leg1));
	else if (leg2 > 0 && leg2 < 1) sessPkt.position.copy(along(toRelay.curvePts, 1 - leg2));
	else if (leg3 > 0 && leg3 < 1) sessPkt.position.lerpVectors(runnerTop, V(0, 1.2, 0), leg3);
	sessPkt.material.opacity = ph > 0.28 && ph < 0.62 ? 1 : 0;
	port443.scale.setScalar(0.01 + 1.2 * Math.max(0, 1 - Math.abs(ph - 0.42) * 10));
	show(lapLbl, seg(ph, 0.22, 0.3) * (1 - seg(p6, 0, 0.2)));
	show(youLbl, (seg(p0, 0.3, 1) * (1 - seg(p1, 0.05, 0.15)) + seg(ph, 0, 0.1)) * (1 - seg(p6, 0, 0.3)));
	kernel.scale.setScalar(Math.max(kernel.scale.x, 0.01 + 1.4 * Math.max(0, 1 - Math.abs(ph - 0.62) * 10)));

	// the machines and the account: named at the start, back again to connect, gone at the end
	const named = seg(p0, 0.3, 1) * (1 - seg(p1, 0.05, 0.15));
	show(proxyLbl, (named + seg(ph, 0.25, 0.35) * (1 - seg(p6, 0, 0.2))) * away);
	show(cpLbl, (named + seg(p1, 0.02, 0.1) * (1 - seg(p1, 0.45, 0.55))) * away);
	show(dbLbl, named * away);
	show(boardLbl, (named + seg(ph, 0.4, 0.5) * (1 - seg(p6, 0, 0.2))) * away);
	show(regionLblB, (named + seg(ph, 0, 0.1) * (1 - seg(p6, 0, 0.2))) * away);
	show(neighLbl, (named + seg(p3, 0.85, 1) * (1 - seg(p4, 0, 0.2))) * away);
	const vis = away > 0.02;
	[board, cpM, cpPanel, proxyM, runner, egress, db, lap, B.region, ...neighbours, ...cores, ...mem, ...nvme].forEach((o) => { o.visible = vis; });
	cpPanel.material.opacity = away;
	floor.material.opacity = 0.35 * (0.4 + 0.6 * away);

	// 6. running: the stack becomes the mark
	const m = smooth(p6);
	[...stack, tip].forEach((d, k) => {
		d.mesh.material.opacity = k === 3 ? Math.min(d.mesh.material.opacity, 1 - m) : 1 - m;
		d.edge.material.opacity = 0.18 * (1 - m);
		const sc = [1.18, 1.18, 1.2, 0.82][k];
		d.scale.set(lerp(1, sc, m), 1, lerp(1, sc, m));
		d.visible = d.visible && m < 0.99;
	});
	markMats.forEach((mt) => { mt.opacity = (mt.userData.max ?? 1) * smooth(seg(p6, 0.15, 0.75)); });
	mark.visible = p6 > 0.15;
	mark.rotation.y = -0.9 * (1 - out(seg(p6, 0.15, 1)));
	mark.scale.setScalar(lerp(0.9, 1, out(seg(p6, 0.15, 1))));
	show(runningLbl, seg(p6, 0.6, 0.85));
}
function ev4(p4) { return smooth(clamp(p4 * (CONSOLE.length + 1.2) - 4)) * (1 - smooth(clamp(p4 * (CONSOLE.length + 1.2) - 5.5))); }

// ---------- the film: one timeline, the intro and then each step ----------
const INTRO = 5.0, OPEN = 2.2;
const NAMES = ['Layers', 'Clone', 'Boundary', 'Boot', 'Connect', 'Running'];
const D = [4.8, 2.6, 3.6, 7.0, 5.6, 3.6];   // seconds per step, each with a beat held at its end
const HOLD = 0.7;
const START = []; { let t = INTRO + OPEN; for (const d of D) { START.push(t); t += d; } }
const END = START[D.length - 1] + D[D.length - 1];
function sOf(T) {
	if (T < INTRO) return 0;
	if (T < INTRO + OPEN) return 0.3 * seg(T, INTRO, INTRO + OPEN) * 0; // the account, named, held
	for (let k = D.length - 1; k >= 0; k--) if (T >= START[k]) return k + clamp((T - START[k]) / (D[k] - HOLD));
	return 0;
}
const CHAPTERS = [
	{ name: 'Click', from: 0, to: INTRO + OPEN },
	...NAMES.map((name, k) => ({ name, from: START[k], to: START[k] + D[k] })),
];
const STEPS = [
	{ k: 'Your account', t: 'Three kinds of machine, each its own: the proxy, the control plane with its database, and runners. In one region of your AWS account.', src: 'overview/how-it-works/#the-pieces' },
	{ k: '01 · Layers', t: 'The runner connects to the control plane and gets the whole list of what should run on it. It fetches the layers it doesn’t have from the bucket, checks each against a digest, and decrypts it.', src: 'overview/how-it-works/#how-a-workspace-comes-to-run' },
	{ k: '02 · Clone', t: 'Your workspace is one new layer on top. Writes land there; the image under it is shared, and nothing is copied.', src: 'concepts/images/' },
	{ k: '03 · Boundary', t: 'QEMU runs as a user of its own, opens nothing by name, has no network, and sits in a namespace of its own.', src: 'security/' },
	{ k: '04 · Boot', t: 'Its own kernel boots. A supervisor speaks to the runner over vsock, and the host’s egress stays closed until a policy opens it.', src: 'concepts/network/' },
	{ k: '05 · Connect', t: 'Open terminal, in the dashboard: your browser reaches the proxy, the only machine the internet can reach, and the session goes through the relay the runner had already connected to.', src: 'use/editors/#the-dashboards-terminal' },
	{ k: '06 · Running', t: 'A whole machine, yours: root, its own kernel, a disk that is a chain of layers.', src: 'concepts/workspaces/' },
];
const INTRO_CAPS = [
	{ until: 1.4, k: 'A click', t: 'Create a workspace from the dashboard, the CLI or the API.' },
	{ until: 3.3, k: 'In your account', t: 'The request reaches your installation\u2019s proxy, in your own AWS account.' },
	{ until: 99, k: 'A runner', t: 'The control plane places it on a runner with room, or starts one for it.', src: 'concepts/workspaces/#states' },
];
const cap = document.getElementById('caption');
let capKey = '';
function caption(c) {
	if (c.k === capKey) return; capKey = c.k;
	cap.style.opacity = 0;
	setTimeout(() => {
		cap.querySelector('.k').textContent = c.k; cap.querySelector('p').textContent = c.t;
		const a = cap.querySelector('a'); a.hidden = !c.src; if (c.src) a.href = '/' + c.src;
		cap.style.opacity = 1;
	}, 120);
}

// ---------- the player ----------
const chaptersEl = document.getElementById('chapters');
const chapterBtns = CHAPTERS.map((c, k) => {
	const b = document.createElement('button'); b.type = 'button';
	b.style.setProperty('--w', String(c.to - c.from));
	b.innerHTML = `<span class="bar"><span class="fill"></span></span><span class="t">${c.name}</span>`;
	b.setAttribute('aria-label', `Play from ${c.name}`);
	b.onclick = () => jump(k); chaptersEl.appendChild(b); return b;
});
const playBtn = document.getElementById('play'), stepBtn = document.getElementById('stepmode'), nextBtn = document.getElementById('next');
let T = 0, playing = !still, stepMode = false, holdAt = Infinity, dirty = true;
function setPlaying(p) { playing = p; playBtn.textContent = p ? '❚❚' : '▶'; playBtn.setAttribute('aria-label', p ? 'Pause' : 'Play'); updateNext(); dirty = true; }
function chapterAt(t) { for (let k = CHAPTERS.length - 1; k >= 0; k--) if (t >= CHAPTERS[k].from - 1e-6) return k; return 0; }
function updateNext() { nextBtn.hidden = !(stepMode && !playing && T < END - 0.01); }
function jump(k) {
	T = CHAPTERS[k].from + (k === 0 ? 0 : 0.001);
	if (still) { T = CHAPTERS[k].to - 0.01; setPlaying(false); return; }
	holdAt = stepMode ? CHAPTERS[k].to : Infinity;
	setPlaying(true);
}
playBtn.onclick = () => {
	if (!playing && T >= END - 0.01) { jump(0); return; }
	if (!playing && stepMode) holdAt = CHAPTERS[chapterAt(T + 0.01)].to;
	setPlaying(!playing);
};
stepBtn.onclick = () => {
	stepMode = !stepMode; stepBtn.setAttribute('aria-pressed', String(stepMode));
	holdAt = stepMode ? CHAPTERS[chapterAt(T)].to : Infinity; updateNext();
};
nextBtn.onclick = () => { const k = chapterAt(T + 0.01); jump(Math.min(CHAPTERS.length - 1, T >= CHAPTERS[k].to - 0.02 ? k + 1 : k)); };
document.getElementById('replay').onclick = () => jump(0);
stage.addEventListener('keydown', (e) => {
	if (e.key === ' ' && e.target === stage) { e.preventDefault(); playBtn.click(); }
	if (e.key === 'ArrowRight') jump(Math.min(CHAPTERS.length - 1, chapterAt(T) + 1));
	if (e.key === 'ArrowLeft') jump(Math.max(0, chapterAt(T) - 1));
});
stage.tabIndex = -1;

// Debug: ?at=<seconds> freezes the film there.
const Q = new URLSearchParams(location.search);
if (Q.has('at')) { T = Number(Q.get('at')); setPlaying(false); }
if (still && !Q.has('at')) { T = END; setPlaying(false); }

// ---------- render ----------
const flash = document.getElementById('flash');
const composer = new EffectComposer(renderer);
const pass = new RenderPass(A, camera); composer.addPass(pass);
composer.addPass(new UnrealBloomPass(new THREE.Vector2(1, 1), 0.7, 0.5, 0.86));
composer.addPass(new OutputPass());
function resize() {
	const w = stage.clientWidth, h = stage.clientHeight;
	renderer.setSize(w, h, false); composer.setSize(w, h); labelRenderer.setSize(w, h);
	camera.aspect = w / h; camera.updateProjectionMatrix(); dirty = true;
}
addEventListener('resize', resize); resize();
let visible = true;
new IntersectionObserver(([e]) => { visible = e.isIntersecting; }).observe(stage);
function hideLabels(scene) { scene.traverse((o) => { if (o.isCSS2DObject) o.element.style.display = 'none'; }); }

let last = performance.now();
function loop(now) {
	requestAnimationFrame(loop);
	const dt = Math.min(0.1, (now - last) / 1000); last = now;
	if (!visible) return;
	if (playing) {
		T += dt;
		if (T >= holdAt) { T = holdAt; holdAt = Infinity; setPlaying(false); }
		if (T >= END) { T = END; setPlaying(false); }
	} else if (!dirty) return;
	dirty = false;
	const k = chapterAt(T);
	chapterBtns.forEach((b, i) => {
		const c = CHAPTERS[i];
		b.querySelector('.fill').style.width = (100 * clamp((T - c.from) / (c.to - c.from))).toFixed(1) + '%';
		b.setAttribute('aria-current', String(i === k));
	});
	flash.style.opacity = (T < INTRO ? seg(T, 4.55, INTRO) : 1 - seg(T, INTRO, INTRO + 0.6)).toFixed(3);
	if (T < INTRO) {
		pass.scene = A; shotA(T);
		caption(INTRO_CAPS.find((c) => T < c.until));
		setTerm(0, false); meter.style.opacity = 0;
		hideLabels(B); labelRenderer.render(A, camera);
	} else {
		const s = T < INTRO + OPEN ? 0 : sOf(T);
		pass.scene = B; shotB(s, T < INTRO + OPEN ? seg(T, INTRO + 0.4, INTRO + 1.2) : 1);
		const idx = T < START[0] ? 0 : Math.min(STEPS.length - 1, chapterAt(T));
		caption(STEPS[idx]);
		hideLabels(A); labelRenderer.render(B, camera);
	}
	composer.render();
}
document.fonts.ready.then(() => { dirty = true; lapLast = -1; cpPanelLast = -1; });
requestAnimationFrame(loop);
</script>
